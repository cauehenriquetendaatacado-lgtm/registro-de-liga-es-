# Opcional: "Blueprint" do Render. Com este arquivo, New > Blueprint já cria o serviço configurado.
services:
  - type: web
    name: ligacoes-yealink
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /saude
    envVars:
      - key: DATABASE_URL
        sync: false        # cole a Connection String do Supabase (Session pooler)
      - key: TOKEN
        sync: false        # defina a senha de acesso
      - key: CX_URL
        sync: false        # ex: https://tendaatacado.3cx.com.br:5001
      - key: CX_CLIENT_ID
        sync: false        # ID da chave de API do 3CX
      - key: CX_SECRET
        sync: false        # Secret da chave de API do 3CX
