<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestão de chamadas</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f1ec;--card:#fff;--tx:#1b1f23;--mut:#6b7280;--bd:#ddd9d0;--ac:#0f5c4d;--bar:#0f5c4d}
@media(prefers-color-scheme:dark){:root{--bg:#121513;--card:#1b201d;--tx:#e9eeea;--mut:#98a39c;--bd:#2c342f;--ac:#5fd0b4;--bar:#5fd0b4}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 Figtree,system-ui,sans-serif}
main{max-width:1180px;margin:0 auto;padding:24px 16px 48px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;margin-bottom:18px}
h1{font-size:24px;margin:0}h2{font-size:15px;margin:0 0 12px}a{color:var(--ac)}
#st{color:var(--mut);font-size:13px}.sp{flex:1}
.fil{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
select,input,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:9px 12px}
button{cursor:pointer;font-weight:600}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ac)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.card,.box{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px}
.card b{display:block;font-size:30px;line-height:1.1}.card span{color:var(--mut)}
.meter{height:6px;background:var(--bd);border-radius:3px;margin-top:10px;overflow:hidden}.meter i{display:block;height:100%;background:var(--bar)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}@media(max-width:800px){.g2{grid-template-columns:1fr}}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:420px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--bd)}th{color:var(--mut);font-weight:600;font-size:13px}tr:last-child td{border:0}
td.n,th.n{text-align:right}.dias{display:flex;align-items:flex-end;gap:6px;height:150px}
.dia{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:12px;color:var(--mut)}
.dia i{display:block;width:100%;background:var(--bar);border-radius:4px 4px 0 0;min-height:2px}.dia b{color:var(--tx);font-size:12px}
.vazio{color:var(--mut);padding:12px 0}
</style></head><body><main>
<header><h1>Gestão de chamadas</h1><span id="st">conectando…</span><span class="sp"></span><a href="/">Lista ao vivo</a><button id="csv">Exportar CSV</button></header>
<div class="fil">
  <select id="per" aria-label="Período"><option value="0">Hoje</option><option value="7" selected>Últimos 7 dias</option><option value="30">Últimos 30 dias</option><option value="tudo">Todo o período</option></select>
  <select id="at" aria-label="Atendente"></select><select id="q" aria-label="Qualificação"></select>
  <input id="b" type="search" placeholder="Buscar nome, número ou observação" style="flex:1;min-width:220px">
</div>
<div class="cards" id="cards"></div>
<div class="g2">
  <section class="box"><h2>Por atendente</h2><div class="tw" id="mat"></div></section>
  <section class="box"><h2>Chamadas por dia</h2><div id="dias"></div></section>
</div>
<section class="box"><h2>Registros <span id="cnt" style="color:var(--mut);font-weight:400"></span></h2>
<div class="tw"><table><thead><tr><th>Data</th><th>Atendente</th><th>Contato</th><th>Número</th><th>Qualificação</th><th>Observação</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let token=localStorage.getItem('tk')||prompt('Senha do painel:');localStorage.setItem('tk',token||'');
let all=[],vis=[];
function filtrar(){const per=$('#per').value,at=$('#at').value,q=$('#q').value,b=$('#b').value.trim().toLowerCase();
  const h=new Date();h.setHours(0,0,0,0);const ini=per==='tudo'?0:per==='0'?h.getTime():Date.now()-(+per)*864e5;
  return all.filter(c=>new Date(c.data).getTime()>=ini&&(!at||c.atendente===at)&&(!q||c.qualificacao===q)&&(!b||((c.numero||'')+' '+(c.contato||'')+' '+(c.observacao||'')).toLowerCase().includes(b)))}
const uniq=k=>[...new Set(all.map(c=>c[k]).filter(Boolean))].sort();
function selects(){[['at','Todos os atendentes','atendente'],['q','Todas as qualificações','qualificacao']].forEach(([id,t,k])=>{
  const el=$('#'+id),v=el.value,l=uniq(k);el.innerHTML=`<option value="">${t}</option>`+l.map(x=>`<option ${x===v?'selected':''} value="${esc(x)}">${esc(x)}</option>`).join('')})}
function desenhar(){vis=filtrar();const qs=uniq('qualificacao'),tot=vis.length;
  const cont=q=>vis.filter(c=>c.qualificacao===q).length;
  $('#cards').innerHTML=`<div class="card"><b>${tot}</b><span>Total de chamadas</span></div>`+qs.map(q=>{const n=cont(q),p=tot?Math.round(n*100/tot):0;
    return `<div class="card"><b>${n}</b><span>${esc(q)} · ${p}%</span><div class="meter"><i style="width:${p}%"></i></div></div>`}).join('');
  const ats=[...new Set(vis.map(c=>c.atendente||'—'))].map(a=>({a,l:vis.filter(c=>(c.atendente||'—')===a)})).sort((x,y)=>y.l.length-x.l.length);
  $('#mat').innerHTML=ats.length?`<table><thead><tr><th>Atendente</th>${qs.map(q=>`<th class="n">${esc(q)}</th>`).join('')}<th class="n">Total</th></tr></thead><tbody>${ats.map(r=>`<tr><td>${esc(r.a)}</td>${qs.map(q=>`<td class="n">${r.l.filter(c=>c.qualificacao===q).length}</td>`).join('')}<td class="n"><b>${r.l.length}</b></td></tr>`).join('')}</tbody></table>`:'<div class="vazio">Sem registros neste filtro.</div>';
  const d={};vis.forEach(c=>{const k=new Date(c.data).toLocaleDateString('sv');d[k]=(d[k]||0)+1});
  const ks=Object.keys(d).sort().slice(-14),mx=Math.max(1,...ks.map(k=>d[k]));
  $('#dias').innerHTML=ks.length?`<div class="dias">${ks.map(k=>`<div class="dia"><b>${d[k]}</b><i style="height:${Math.max(2,d[k]*110/mx)}px"></i>${k.slice(8)}/${k.slice(5,7)}</div>`).join('')}</div>`:'<div class="vazio">Sem registros neste filtro.</div>';
  $('#cnt').textContent=tot>200?`(mostrando 200 de ${tot})`:`(${tot})`;
  $('#rows').innerHTML=tot?vis.slice(0,200).map(c=>`<tr><td>${new Date(c.data).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}</td><td>${esc(c.atendente)}</td><td>${esc(c.contato)}</td><td>${esc(c.numero)}</td><td>${esc(c.qualificacao)}</td><td>${esc(c.observacao)}</td></tr>`).join(''):'<tr><td colspan="6" class="vazio">Nenhuma chamada neste filtro.</td></tr>'}
['per','at','q'].forEach(i=>$('#'+i).onchange=desenhar);$('#b').oninput=desenhar;
$('#csv').onclick=()=>{const c=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
  const l=[['Data','Atendente','Contato','Número','Qualificação','Observação'].map(c).join(';'),...vis.map(r=>[new Date(r.data).toLocaleString('pt-BR'),r.atendente,r.contato,r.numero,r.qualificacao,r.observacao].map(c).join(';'))];
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+l.join('\r\n')],{type:'text/csv;charset=utf-8'}));a.download='chamadas-'+new Date().toLocaleDateString('sv')+'.csv';a.click()};
fetch('/api/chamadas?limite=5000',{headers:{'x-token':token}}).then(r=>r.ok?r.json():Promise.reject()).then(d=>{all=d;selects();desenhar()}).catch(()=>{$('#st').textContent='senha incorreta';localStorage.removeItem('tk')});
function ws(){const w=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host);
  w.onopen=()=>$('#st').textContent='ao vivo';w.onclose=()=>{$('#st').textContent='reconectando…';setTimeout(ws,2000)};
  w.onmessage=e=>{const c=JSON.parse(e.data),i=all.findIndex(x=>x.id===c.id);i<0?all.unshift(c):all[i]=c;selects();desenhar()}}
ws();
</script></main></body></html>
