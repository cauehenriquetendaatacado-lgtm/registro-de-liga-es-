<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10151b"><link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png"><title>Qualificar chamada</title>
<style>
:root{--bg:#10151b;--card:#18202a;--tx:#e8edf2;--mut:#93a0ad;--bd:#2a3541}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif;padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom))}
main{max-width:480px;margin:0 auto;padding-top:16px}
h1{font-size:20px;margin:0 0 4px}p{color:var(--mut);margin:0 0 16px}
input,textarea{width:100%;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:13px;font:inherit;margin-bottom:10px}
.op{display:block;width:100%;border:0;border-radius:14px;padding:22px 16px;margin-bottom:12px;font:700 20px system-ui;color:#fff;cursor:pointer}
.op:active{transform:scale(.98)}.op:disabled{opacity:.5}
.op:focus-visible,input:focus-visible,textarea:focus-visible,.lk:focus-visible{outline:3px solid #fff}
.go{background:#1f5eff;color:#fff;border:0;border-radius:10px;padding:14px;width:100%;font:700 16px system-ui}
#msg{min-height:24px;margin:4px 0 12px;font-weight:600}#msg.err{color:#fb923c}#msg.ok{color:#4ade80}
.top{display:flex;justify-content:space-between;align-items:baseline}.lk{background:none;border:0;color:var(--mut);text-decoration:underline;font:inherit;cursor:pointer}
ul{list-style:none;padding:0;margin:8px 0 0}li{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--bd);color:var(--mut)}
li b{color:var(--tx)}[hidden]{display:none!important}
</style></head><body><main>
<section id="cfg" hidden>
  <h1>Primeiro acesso</h1><p>Informe seu nome e a senha fornecida pelo gestor.</p>
  <input id="nome" placeholder="Seu nome" autocomplete="name">
  <input id="senha" type="password" placeholder="Senha" autocomplete="current-password">
  <button class="go" id="salvar">Entrar</button><p id="cerr" style="color:#fb923c;margin-top:10px"></p>
</section>
<section id="app" hidden>
  <div class="top"><h1>Como foi a ligação?</h1><button class="lk" id="sair">Sair</button></div>
  <p id="quem"></p>
  <input id="num" type="tel" inputmode="tel" placeholder="Número (opcional)">
  <textarea id="obs" rows="2" placeholder="Observação (opcional)"></textarea>
  <div id="ops"></div><div id="msg" role="status"></div>
  <strong>Enviadas hoje: <span id="n">0</span></strong><ul id="hist"></ul>
</section>
<script>
const $=s=>document.querySelector(s),L=localStorage,J=k=>JSON.parse(L.getItem(k)||'null');
const hoje=()=>new Date().toDateString();
let opcoes=J('opcoes')||[],fila=J('fila')||[],hist=(J('hist')||[]).filter(h=>new Date(h.t).toDateString()===hoje());
const H=()=>({'x-token':L.getItem('tk'),'Content-Type':'application/json'});
const msg=(t,c)=>{$('#msg').textContent=t;$('#msg').className=c||''};
function tela(){const ok=L.getItem('tk')&&L.getItem('nome');$('#cfg').hidden=!!ok;$('#app').hidden=!ok;
  if(ok){$('#quem').textContent=L.getItem('nome');botoes();lista();carregar();enviarFila()}}
const cores=['#b4232a','#1f5eff','#0f766e','#7c3aed','#b45309'];
function botoes(){$('#ops').innerHTML=opcoes.map((o,i)=>`<button class="op" style="background:${cores[i%5]}" data-o="${o}">${o}</button>`).join('')}
function lista(){$('#n').textContent=hist.length;$('#hist').innerHTML=hist.slice().reverse().map(h=>`<li><span><b>${h.q}</b> ${h.num||''}</span><span>${new Date(h.t).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}${h.p?' · pendente':''}</span></li>`).join('')}
async function carregar(){try{const r=await fetch('/api/opcoes',{headers:H()});if(r.status===401)return sair();opcoes=await r.json();L.setItem('opcoes',JSON.stringify(opcoes));botoes()}catch{}}
async function enviar(c){const r=await fetch('/api/chamadas',{method:'POST',headers:H(),body:JSON.stringify(c)});if(r.status===401){sair();throw 0}if(!r.ok&&r.status<500&&r.status!==401)return;if(!r.ok)throw 0}
async function enviarFila(){const resto=[];for(const c of fila){try{await enviar(c)}catch{resto.push(c)}}
  fila=resto;L.setItem('fila',JSON.stringify(fila));hist.forEach(h=>{if(h.p&&!fila.find(f=>f.uid===h.uid))h.p=0});L.setItem('hist',JSON.stringify(hist));lista()}
$('#ops').onclick=async e=>{const b=e.target.closest('.op');if(!b)return;
  const c={uid:crypto.randomUUID(),qualificacao:b.dataset.o,numero:$('#num').value.trim(),observacao:$('#obs').value.trim(),atendente:L.getItem('nome'),data:new Date().toISOString()};
  b.disabled=true;let p=0;
  try{await enviar(c);msg('Enviado: '+c.qualificacao,'ok')}catch{if(!L.getItem('tk'))return;fila.push(c);L.setItem('fila',JSON.stringify(fila));p=1;msg('Sem conexão. Guardado no celular e será enviado depois.','err')}
  hist.push({uid:c.uid,q:c.qualificacao,num:c.numero,t:c.data,p});L.setItem('hist',JSON.stringify(hist));lista();
  $('#num').value='';$('#obs').value='';b.disabled=false;if(navigator.vibrate)navigator.vibrate(40)};
$('#salvar').onclick=async()=>{const n=$('#nome').value.trim(),s=$('#senha').value;if(!n||!s){$('#cerr').textContent='Preencha nome e senha.';return}
  try{const r=await fetch('/api/opcoes',{headers:{'x-token':s}});if(!r.ok){$('#cerr').textContent='Senha incorreta.';return}
    L.setItem('tk',s);L.setItem('nome',n);opcoes=await r.json();L.setItem('opcoes',JSON.stringify(opcoes));tela()}catch{$('#cerr').textContent='Sem conexão com o servidor.'}};
function sair(){L.removeItem('tk');tela()}$('#sair').onclick=()=>{L.removeItem('tk');L.removeItem('nome');tela()};
addEventListener('online',enviarFila);document.addEventListener('visibilitychange',()=>{if(!document.hidden)enviarFila()});
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');
tela();
</script></main></body></html>
